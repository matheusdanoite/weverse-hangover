<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0010" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <title>Weverse Hangover — Live Board</title>
  <meta name="description" content="Mural ao vivo da Hangul Hangover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700;800&family=Outfit:wght@300;400;600;700;800;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./board.css" />
</head>
<body>
  <div class="kinetic-bg tint-default" id="kineticBg"></div>

  <header class="board-header" id="boardHeader">
    <div class="header-left">
      <span class="live-dot"></span>
      <div class="wordmark">
        <span class="wm-weverse">WEVERSE</span>
        <span class="wm-hangover">HANGOVER</span>
      </div>
    </div>
    <div class="header-right">
      <div class="stats-bar" id="statsBar">
        <span class="stat-chip" id="statPosts">
          <span class="stat-val">0</span>
          <span class="stat-label">posts</span>
        </span>
        <span class="stat-chip" id="statLikes">
          <span class="stat-val">0</span>
          <span class="stat-label">curtidas</span>
        </span>
      </div>
    </div>
  </header>

  <div class="view-label-wrap" id="viewLabelWrap">
    <div class="view-label-text" id="viewLabelText"></div>
  </div>

  <main class="board-scene" id="boardScene"></main>

  <div class="empty-state hidden" id="emptyState">
    <div class="empty-glyph">✦</div>
    <p class="empty-title">aguardando o primeiro post...</p>
    <p class="empty-sub">acesse e poste algo</p>
  </div>

  <div class="pause-indicator" id="pauseIndicator">⏸ PAUSADO</div>

  <script type="module" src="./board.js"></script>
</body>
</html>
