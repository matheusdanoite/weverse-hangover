<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ADM — Weverse Hangover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/shared.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; min-height: 100dvh;
      background: var(--bg); color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    button { border: none; }

    /* ── Login ── */
    .login-screen {
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 32px;
    }
    .login-brand { text-align: center; }
    .login-brand .w1 { display: block; font-size: 2rem; font-weight: 800; letter-spacing: .12em; color: var(--pink-neon); text-shadow: 0 0 20px var(--pink-glow); }
    .login-brand .w2 { display: block; font-size: 2rem; font-weight: 300; letter-spacing: .22em; color: var(--purple-accent); }
    .login-brand .tag { display: block; font-size: .75rem; letter-spacing: .2em; color: var(--text-muted); margin-top: 8px; text-transform: uppercase; }
    .login-btn {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface-2); border: 1px solid var(--border-strong);
      color: var(--text-primary); padding: 14px 28px; border-radius: 12px;
      font-size: 1rem; font-weight: 600; transition: background .2s;
    }
    .login-btn:hover { background: var(--surface-hover); }

    /* ── Shell ── */
    .shell { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }

    /* ── Header ── */
    .adm-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .adm-brand .w1 { font-size: 1.05rem; font-weight: 800; color: var(--pink-neon); }
    .adm-brand .w2 { font-size: 1.05rem; font-weight: 300; color: var(--purple-accent); }
    .adm-brand .tag { font-size: .6rem; letter-spacing: .15em; color: var(--text-muted); text-transform: uppercase; }

    .btn-reports {
      position: relative;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-1); border: 1px solid var(--border-subtle);
      border-radius: 50%; color: var(--text-secondary);
      transition: background .2s, border-color .2s, color .2s;
      flex-shrink: 0;
    }
    .btn-reports:hover { background: var(--surface-hover); color: var(--text-primary); }
    .btn-reports.has-reports { border-color: rgba(255,59,59,.5); color: var(--red); }

    .reports-badge {
      position: absolute; top: -3px; right: -3px;
      background: var(--red); color: #fff;
      font-size: .58rem; font-weight: 700;
      padding: 1px 5px; border-radius: 20px;
      min-width: 16px; text-align: center; line-height: 1.6;
      pointer-events: none;
    }

    /* ── Stats bar ── */
    .stats-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .stat-card {
      flex: 1; min-width: 70px; background: var(--surface-2);
      border: 1px solid var(--border-subtle); border-radius: 10px; padding: 10px 12px;
    }
    .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--pink-neon); line-height: 1; }
    .stat-label { font-size: .65rem; color: var(--text-muted); margin-top: 2px; }

    /* ── Controls bar ── */
    .controls-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .search-input {
      flex: 1; min-width: 160px; background: var(--surface-2);
      border: 1px solid var(--border-subtle); border-radius: 8px;
      color: var(--text-primary); padding: 9px 12px; font-size: .88rem;
      outline: none; transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--purple-accent); }
    .search-input::placeholder { color: var(--text-muted); }
    .filter-select {
      background: var(--surface-2); border: 1px solid var(--border-subtle);
      border-radius: 8px; color: var(--text-primary); padding: 9px 12px;
      font-size: .88rem; outline: none; cursor: pointer;
    }
    .filter-select option { background: #1a0a2e; }
    .btn-refresh {
      background: var(--surface-2); border: 1px solid var(--border-subtle);
      color: var(--text-secondary); padding: 9px 14px; border-radius: 8px;
      font-size: .82rem; display: flex; align-items: center; gap: 5px;
      transition: background .2s;
    }
    .btn-refresh:hover { background: var(--surface-hover); }
    .posts-count-tools { font-size: .75rem; color: var(--text-muted); }

    /* ── Admin Composer ── */
    .compose-section {
      background: var(--surface-1); border: 1px solid var(--border-subtle);
      border-radius: 14px; padding: 14px; margin-bottom: 16px;
    }
    .compose-row { display: flex; gap: 12px; align-items: flex-start; }
    .compose-avatar {
      width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
      border: 1px solid var(--border-strong);
      background-size: 130% 130%; background-position: center center;
    }
    .compose-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .compose-textarea {
      width: 100%; background: transparent; border: none; outline: none;
      color: var(--text-primary); font-size: .95rem;
      line-height: 1.5; resize: none; min-height: 44px;
      caret-color: var(--pink-neon);
    }
    .compose-textarea::placeholder { color: var(--text-muted); }
    .compose-footer {
      display: flex; justify-content: flex-end; align-items: center; gap: 10px;
      border-top: 1px solid var(--border-subtle); padding-top: 8px;
    }
    .compose-count { font-size: .75rem; color: var(--text-muted); }
    .compose-count.over { color: var(--red); }
    .compose-btn {
      background: var(--pink-neon); color: #fff;
      padding: 7px 20px; border-radius: 20px;
      font-size: .85rem; font-weight: 700; letter-spacing: .04em;
      transition: opacity .15s, transform .1s;
    }
    .compose-btn:disabled { opacity: .4; cursor: not-allowed; }
    .compose-btn:not(:disabled):hover { opacity: .85; }
    .compose-btn:not(:disabled):active { transform: scale(.97); }

    /* ── Post list ── */
    .post-list { display: flex; flex-direction: column; gap: 10px; }
    .post-list .post { border-radius: 12px; }
    .post-list .reply-btn.open { background: rgba(155,89,255,.1); color: var(--purple-accent); }
    .replies-empty { font-size: .8rem; color: var(--text-muted); padding: 4px 0 8px; }

    /* ── Reports overlay ── */
    .reports-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: var(--bg);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      overflow: hidden;
    }
    .reports-overlay.open { transform: translateX(0); }

    .reports-overlay-header {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 16px 14px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .btn-reports-close {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      transition: background .2s; flex-shrink: 0;
    }
    .btn-reports-close:hover { background: var(--surface-hover); }
    .reports-overlay-title { font-size: 1rem; font-weight: 700; flex: 1; }
    .reports-overlay-count {
      font-size: .72rem; font-weight: 700;
      background: rgba(255,59,59,.15); color: var(--red);
      padding: 3px 9px; border-radius: 20px;
    }
    .reports-overlay-list {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 16px; display: flex; flex-direction: column; gap: 14px;
      max-width: 860px; width: 100%; margin: 0 auto;
    }
    .reports-empty {
      text-align: center; padding: 60px 20px;
      color: var(--text-muted); font-size: .9rem;
    }

    /* ── Report post item ── */
    .report-post-wrap { display: flex; flex-direction: column; gap: 6px; }
    .report-action-bar { display: flex; gap: 8px; }
    .btn-report-del {
      flex: 1;
      background: rgba(255,59,59,.07); border: 1px solid rgba(255,59,59,.22);
      color: var(--red); padding: 10px 14px; border-radius: 10px;
      font-size: .85rem; font-weight: 600; transition: background .15s;
    }
    .btn-report-del:hover { background: rgba(255,59,59,.16); }
    .btn-report-maintain {
      flex: 1;
      background: rgba(52,232,158,.07); border: 1px solid rgba(52,232,158,.22);
      color: var(--green); padding: 10px 14px; border-radius: 10px;
      font-size: .85rem; font-weight: 600; transition: background .15s;
    }
    .btn-report-maintain:hover { background: rgba(52,232,158,.18); }

    /* ── Loading / empty ── */
    .state-loading { text-align: center; padding: 50px 20px; color: var(--text-muted); }
    .state-empty   { text-align: center; padding: 50px 20px; color: var(--text-muted); }

    /* ── Confirm modal ── */
    .confirm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.72);
      display: flex; align-items: center; justify-content: center;
      z-index: 9998; backdrop-filter: blur(4px);
    }
    .confirm-card {
      background: #1e0d35; border: 1px solid var(--border-strong);
      border-radius: 16px; padding: 28px 24px; max-width: 340px; width: 90%;
    }
    .confirm-icon  { font-size: 2rem; margin-bottom: 10px; text-align: center; }
    .confirm-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 7px; text-align: center; }
    .confirm-desc  { font-size: .86rem; color: var(--text-secondary); margin-bottom: 18px; line-height: 1.5; text-align: center; }
    .confirm-actions { display: flex; gap: 10px; justify-content: center; }
    .btn-cancel {
      background: var(--surface-2); border: 1px solid var(--border-subtle);
      color: var(--text-secondary); padding: 9px 20px; border-radius: 10px; font-size: .88rem;
    }
    .btn-confirm-del {
      background: rgba(255,59,59,.15); border: 1px solid rgba(255,59,59,.4);
      color: var(--red); padding: 9px 20px; border-radius: 10px;
      font-size: .88rem; font-weight: 700; transition: background .2s;
    }
    .btn-confirm-del:hover { background: rgba(255,59,59,.28); }
    .btn-confirm-maintain {
      background: rgba(52,232,158,.12); border: 1px solid rgba(52,232,158,.3);
      color: var(--green); padding: 9px 20px; border-radius: 10px;
      font-size: .88rem; font-weight: 700; transition: background .2s;
    }
    .btn-confirm-maintain:hover { background: rgba(52,232,158,.22); }
    .btn-confirm-maintain:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Manter dialog extras ── */
    .maintain-label {
      display: block; font-size: .78rem; color: var(--text-secondary);
      margin-bottom: 6px; text-align: left;
    }
    .maintain-textarea {
      width: 100%; background: var(--surface-2);
      border: 1px solid var(--border-subtle); border-radius: 8px;
      color: var(--text-primary); padding: 10px 12px;
      font-size: .88rem; line-height: 1.4; resize: none; min-height: 80px;
      outline: none; transition: border-color .2s; margin-bottom: 16px;
    }
    .maintain-textarea:focus { border-color: var(--green); }
  </style>
</head>

<body>

  <!-- Login -->
  <div id="loginScreen" class="login-screen hidden">
    <div class="login-brand">
      <span class="w1">WEVERSE</span>
      <span class="w2">HANGOVER</span>
      <span class="tag">painel administrativo</span>
    </div>
    <button id="loginBtn" class="login-btn">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Entrar com Google
    </button>
  </div>

  <!-- Admin shell -->
  <div id="adminShell" class="shell hidden">

    <header class="adm-header">
      <div class="adm-brand">
        <span class="w1">WEVERSE </span><span class="w2">HANGOVER</span>
        <div class="tag">painel administrativo</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="searchToggleBtn" class="btn-reports" title="Buscar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <button id="reportsBtn" class="btn-reports" title="Denúncias">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
          <span class="reports-badge hidden" id="reportsBadge"></span>
        </button>
      </div>
    </header>

    <div id="searchBar" style="display:none; margin-bottom:16px;">
      <input type="search" id="searchInput" class="search-input" style="width:100%; box-sizing:border-box;" placeholder="buscar por autor ou conteúdo…" />
    </div>

    <!-- Composer -->
    <section class="compose-section">
      <div class="compose-row">
        <div class="compose-avatar" id="composeAvatar"></div>
        <div class="compose-body">
          <textarea id="composeText" class="compose-textarea" maxlength="300"
            placeholder="diga algo para a galera…" rows="2"></textarea>
          <div class="compose-footer">
            <span class="compose-count" id="composeCount">0/300</span>
            <button id="composeBtn" class="compose-btn" disabled>postar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Controls -->
    <div class="controls-bar">
      <select id="filterSelect" class="filter-select">
        <option value="all">todos os posts</option>
        <option value="text">só textos</option>
        <option value="drawing">só desenhos</option>
      </select>
      <button id="refreshBtn" class="btn-refresh">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        atualizar
      </button>
      <span class="posts-count-tools" id="postsCountTools"></span>
    </div>

    <!-- Feed -->
    <div id="postList" class="post-list"></div>

  </div>

  <!-- Reports overlay (full-screen, slides in from right) -->
  <div id="reportsOverlay" class="reports-overlay">
    <div class="reports-overlay-header">
      <button id="reportsClose" class="btn-reports-close" type="button" title="Voltar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="reports-overlay-title">denúncias</span>
      <span class="reports-overlay-count hidden" id="reportsOverlayCount"></span>
    </div>
    <div id="reportsOverlayList" class="reports-overlay-list"></div>
  </div>

  <!-- Loading -->
  <div id="loadingScreen" class="state-loading">
    <svg class="spinner" width="32" height="32" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" stroke="rgba(255,45,120,0.3)" stroke-width="3" fill="none"/>
      <path d="M12 2a10 10 0 0 1 10 10" stroke="#ff2d78" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <p style="margin-top:12px;font-size:.85rem">carregando…</p>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Confirm modal (delete) -->
  <div id="confirmOverlay" class="confirm-overlay hidden">
    <div class="confirm-card">
      <div class="confirm-icon">🗑️</div>
      <div class="confirm-title" id="confirmTitle">Deletar post?</div>
      <div class="confirm-desc" id="confirmDesc">Esta ação é permanente.</div>
      <div class="confirm-actions">
        <button id="confirmCancel" class="btn-cancel">cancelar</button>
        <button id="confirmOk" class="btn-confirm-del">deletar</button>
      </div>
    </div>
  </div>

  <!-- Manter modal -->
  <div id="maintainOverlay" class="confirm-overlay hidden">
    <div class="confirm-card">
      <div class="confirm-title">Manter post?</div>
      <div class="confirm-desc" id="maintainDesc"></div>
      <div id="maintainNoteWrap" class="hidden">
        <label class="maintain-label">Justificativa (obrigatória para 3+ denúncias)</label>
        <textarea id="maintainNoteInput" class="maintain-textarea"
          placeholder="Explique o motivo de manter este post…" maxlength="300"></textarea>
      </div>
      <div class="confirm-actions">
        <button id="maintainCancel" class="btn-cancel">cancelar</button>
        <button id="maintainOk" class="btn-confirm-maintain">manter</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
    import {
      getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
      serverTimestamp, query, orderBy, getDocs, limit, increment
    } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';
    import {
      gradientCSS, escapeHTML, formatTimeAbs,
      buildPostCard, updatePostCard,
    } from '../src/shared.js';

    // Moderator profiles fetched from server — emails never exposed in client JS
    const firebaseConfig = await fetch('/api/config').then(r => r.json());
    const MODERATORS = Object.fromEntries(
      (firebaseConfig.moderatorProfiles || []).map(p => [p.email, p])
    );
    const MOD_NAMES = new Set(Object.values(MODERATORS).map(p => p.name));

    const POSTS = 'hangul_messages';

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ── DOM ──
    const loginScreen        = document.getElementById('loginScreen');
    const adminShell         = document.getElementById('adminShell');
    const loadingScreen      = document.getElementById('loadingScreen');
    const loginBtn           = document.getElementById('loginBtn');
    const reportsBtn         = document.getElementById('reportsBtn');
    const reportsOverlay     = document.getElementById('reportsOverlay');
    const reportsClose       = document.getElementById('reportsClose');
    const reportsOverlayCount= document.getElementById('reportsOverlayCount');
    const reportsOverlayList = document.getElementById('reportsOverlayList');
    const reportsBadge       = document.getElementById('reportsBadge');
    const searchToggleBtn    = document.getElementById('searchToggleBtn');
    const searchBar          = document.getElementById('searchBar');
    const searchInput        = document.getElementById('searchInput');
    const filterSelect       = document.getElementById('filterSelect');
    const refreshBtn         = document.getElementById('refreshBtn');
    const postList           = document.getElementById('postList');
    const postsCountTools    = document.getElementById('postsCountTools');
    const composeAvatar      = document.getElementById('composeAvatar');
    const composeText        = document.getElementById('composeText');
    const composeCount       = document.getElementById('composeCount');
    const composeBtn         = document.getElementById('composeBtn');
    const toastEl            = document.getElementById('toast');
    const confirmOverlay     = document.getElementById('confirmOverlay');
    const confirmTitle       = document.getElementById('confirmTitle');
    const confirmDesc        = document.getElementById('confirmDesc');
    const confirmCancel      = document.getElementById('confirmCancel');
    const confirmOk          = document.getElementById('confirmOk');
    const maintainOverlay    = document.getElementById('maintainOverlay');
    const maintainDesc       = document.getElementById('maintainDesc');
    const maintainNoteWrap   = document.getElementById('maintainNoteWrap');
    const maintainNoteInput  = document.getElementById('maintainNoteInput');
    const maintainCancel     = document.getElementById('maintainCancel');
    const maintainOk         = document.getElementById('maintainOk');

    let allPosts        = [];
    let modProfile      = null;
    let pendingConfirm  = null;
    let pendingMaintain = null;
    let toastTimer      = null;

    // ── Toast ──
    function showToast(text, type = '') {
      toastEl.textContent = text;
      toastEl.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    // ── Confirm (delete) ──
    function openConfirm(title, desc, onOk) {
      confirmTitle.textContent = title;
      confirmDesc.textContent  = desc;
      confirmOverlay.classList.remove('hidden');
      pendingConfirm = onOk;
    }
    confirmCancel.addEventListener('click', () => {
      confirmOverlay.classList.add('hidden');
      pendingConfirm = null;
    });
    confirmOk.addEventListener('click', () => {
      confirmOverlay.classList.add('hidden');
      if (pendingConfirm) { pendingConfirm(); pendingConfirm = null; }
    });

    // ── Manter dialog ──
    function openMaintainDialog(post, onOk) {
      const count = post.reportedBy?.length || 0;
      const needsNote = count >= 3;
      maintainDesc.textContent = `Post de @${post.author || 'anônimo'} com ${count} denúncia${count !== 1 ? 's' : ''}. O post voltará a ser visível para todos.`;
      maintainNoteWrap.classList.toggle('hidden', !needsNote);
      maintainNoteInput.value = '';
      maintainOk.disabled = needsNote;
      maintainOverlay.classList.remove('hidden');
      pendingMaintain = { post, onOk, needsNote };
      if (needsNote) setTimeout(() => maintainNoteInput.focus(), 100);
    }

    maintainNoteInput.addEventListener('input', () => {
      if (pendingMaintain?.needsNote) {
        maintainOk.disabled = maintainNoteInput.value.trim().length === 0;
      }
    });

    maintainCancel.addEventListener('click', () => {
      maintainOverlay.classList.add('hidden');
      pendingMaintain = null;
    });

    maintainOk.addEventListener('click', () => {
      if (!pendingMaintain) return;
      if (pendingMaintain.needsNote && !maintainNoteInput.value.trim()) return;
      const note = maintainNoteInput.value.trim();
      const { post, onOk } = pendingMaintain;
      maintainOverlay.classList.add('hidden');
      pendingMaintain = null;
      onOk(post, note);
    });

    // ── Auth ──
    loginBtn.addEventListener('click', async () => {
      try { await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch (e) { showToast('erro ao entrar: ' + e.message, 'error'); }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        loadingScreen.classList.add('hidden');
        loginScreen.classList.remove('hidden');
        adminShell.classList.add('hidden');
        return;
      }
      if (!MODERATORS[user.email]) {
        await signOut(auth);
        showToast('acesso negado', 'error');
        loadingScreen.classList.add('hidden');
        loginScreen.classList.remove('hidden');
        return;
      }
      modProfile = MODERATORS[user.email];
      loginScreen.classList.add('hidden');
      loadingScreen.classList.add('hidden');
      adminShell.classList.remove('hidden');
      adminShell.classList.add('tools-active');
      composeAvatar.style.backgroundImage = gradientCSS(modProfile.gradient);
      loadPosts();
    });

    // ── Reports overlay ──
    reportsBtn.addEventListener('click', () => reportsOverlay.classList.add('open'));
    reportsClose.addEventListener('click', () => reportsOverlay.classList.remove('open'));

    // ── Admin Composer ──
    composeText.addEventListener('input', () => {
      const len = composeText.value.length;
      composeCount.textContent = `${len}/300`;
      composeCount.classList.toggle('over', len > 300);
      composeBtn.disabled = len === 0 || len > 300;
      composeText.style.height = 'auto';
      composeText.style.height = composeText.scrollHeight + 'px';
    });

    composeBtn.addEventListener('click', async () => {
      const text = composeText.value.trim();
      if (!text || !modProfile) return;
      composeBtn.disabled = true;
      composeBtn.textContent = '…';
      try {
        await addDoc(collection(db, POSTS), {
          type: 'text', message: text,
          author: modProfile.name, authorId: modProfile.id,
          gradient: modProfile.gradient,
          likedBy: [], replyCount: 0,
          createdAt: serverTimestamp(),
        });
        composeText.value = '';
        composeText.style.height = 'auto';
        composeCount.textContent = '0/300';
        showToast('postado!', 'success');
        await loadPosts();
      } catch (e) {
        showToast('erro ao postar: ' + e.message, 'error');
      } finally {
        composeBtn.disabled = false;
        composeBtn.textContent = 'postar';
      }
    });

    // ── Search toggle ──
    searchToggleBtn.addEventListener('click', () => {
      if (searchBar.style.display === 'none') {
        searchBar.style.display = 'block';
        searchInput.focus();
      } else {
        searchBar.style.display = 'none';
        searchInput.value = '';
        renderPosts();
      }
    });

    // ── Load posts ──
    async function loadPosts() {
      postList.innerHTML = `<div class="state-loading">
        <svg class="spinner" width="26" height="26" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke="rgba(255,45,120,0.3)" stroke-width="3" fill="none"/>
          <path d="M12 2a10 10 0 0 1 10 10" stroke="#ff2d78" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg></div>`;
      try {
        const q    = query(collection(db, POSTS), orderBy('createdAt', 'desc'), limit(120));
        const snap = await getDocs(q);
        allPosts   = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
        updateReports();
        renderPosts();
      } catch (e) {
        postList.innerHTML = `<div class="state-empty"><p>erro: ${e.message}</p></div>`;
        showToast('erro ao carregar', 'error');
      }
    }

    // ── Reports ──
    function updateReports() {
      // A post needs review when it has more reports than the last maintained count
      const pending = allPosts
        .filter(p => (p.reportedBy?.length || 0) > (p.maintainedCount || 0))
        .sort((a, b) => {
          const da = (a.reportedBy?.length || 0) - (a.maintainedCount || 0);
          const db2= (b.reportedBy?.length || 0) - (b.maintainedCount || 0);
          return db2 - da;
        });

      if (pending.length > 0) {
        reportsBadge.textContent = pending.length;
        reportsBadge.classList.remove('hidden');
        reportsBtn.classList.add('has-reports');
      } else {
        reportsBadge.classList.add('hidden');
        reportsBtn.classList.remove('has-reports');
      }

      reportsOverlayCount.textContent = `${pending.length} post${pending.length !== 1 ? 's' : ''}`;
      reportsOverlayCount.classList.toggle('hidden', pending.length === 0);

      reportsOverlayList.innerHTML = '';
      if (pending.length === 0) {
        reportsOverlayList.innerHTML = `<div class="reports-empty">sem denúncias pendentes ✓</div>`;
        return;
      }

      pending.forEach(post => reportsOverlayList.appendChild(buildReportItem(post)));
    }

    function buildReportItem(post) {
      const wrap = document.createElement('div');
      wrap.className = 'report-post-wrap';

      // Post card (read-only — no like/reply/delete handlers)
      const card = buildPostCard(post.docId, post, {
        me: modProfile,
        modNames: MOD_NAMES,
        formatTimeFn: formatTimeAbs,
      });
      wrap.appendChild(card);

      // Action bar
      const actionBar = document.createElement('div');
      actionBar.className = 'report-action-bar';

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-report-del';
      delBtn.type = 'button';
      delBtn.textContent = 'Deletar';
      delBtn.addEventListener('click', () => {
        const count = post.reportedBy?.length || 0;
        openConfirm(
          'Deletar post denunciado?',
          `De @${post.author || 'anônimo'} — ${count} denúncia${count !== 1 ? 's' : ''}. Ação permanente.`,
          async () => {
            try {
              await deleteDoc(doc(db, POSTS, post.docId));
              allPosts = allPosts.filter(p => p.docId !== post.docId);
              updateReports();
              renderPosts();
              showToast('post deletado', 'success');
            } catch (e) {
              showToast('erro: ' + e.message, 'error');
            }
          }
        );
      });

      const maintainBtn = document.createElement('button');
      maintainBtn.className = 'btn-report-maintain';
      maintainBtn.type = 'button';
      maintainBtn.textContent = 'Manter';
      maintainBtn.addEventListener('click', () => {
        openMaintainDialog(post, (post, note) => doMaintainPost(post, note));
      });

      actionBar.appendChild(delBtn);
      actionBar.appendChild(maintainBtn);
      wrap.appendChild(actionBar);

      return wrap;
    }

    async function doMaintainPost(post, note) {
      try {
        const updateData = { maintainedCount: post.reportedBy?.length || 0 };
        if (note) updateData.maintainNote = note;
        await updateDoc(doc(db, POSTS, post.docId), updateData);
        allPosts = allPosts.map(p =>
          p.docId === post.docId
            ? { ...p, maintainedCount: updateData.maintainedCount, ...(note ? { maintainNote: note } : {}) }
            : p
        );
        updateReports();
        renderPosts();
        showToast('post mantido', 'success');
      } catch (e) {
        showToast('erro: ' + e.message, 'error');
      }
    }

    // ── Render feed ──
    function renderPosts() {
      const search = searchInput.value.toLowerCase().trim();
      const filter = filterSelect.value;
      const filtered = allPosts.filter(p => {
        if (filter === 'text'    && p.type !== 'text')    return false;
        if (filter === 'drawing' && p.type !== 'drawing') return false;
        if (search) {
          const ok = (p.author || '').toLowerCase().includes(search)
                  || (p.message || '').toLowerCase().includes(search);
          if (!ok) return false;
        }
        return true;
      });
      postsCountTools.textContent = `${filtered.length} post${filtered.length !== 1 ? 's' : ''}`;
      if (!filtered.length) {
        postList.innerHTML = `<div class="state-empty"><p>nenhum post encontrado</p></div>`;
        return;
      }
      postList.innerHTML = '';
      filtered.forEach(p => postList.appendChild(buildAdminPostCard(p)));
    }

    function buildAdminPostCard(post) {
      return buildPostCard(post.docId, post, {
        me: modProfile,
        modNames: MOD_NAMES,
        formatTimeFn: formatTimeAbs,
        onDelete: (id, el) => confirmDelete(post, el),
        onReplyClick: (el) => toggleRepliesSection(post, el),
      });
    }

    // ── Replies section (on-demand toggle) ──
    async function toggleRepliesSection(post, articleEl) {
      const section  = articleEl.querySelector('.replies-section');
      const replyBtn = articleEl.querySelector('.reply-btn');

      if (section.children.length > 0) {
        section.innerHTML = '';
        replyBtn.classList.remove('open');
        return;
      }

      replyBtn.classList.add('open');
      const thread = document.createElement('div');
      thread.className = 'reply-thread';

      try {
        const q    = query(collection(db, POSTS, post.docId, 'replies'), orderBy('createdAt', 'asc'));
        const snap = await getDocs(q);
        if (snap.empty) {
          const empty = document.createElement('p');
          empty.className = 'replies-empty';
          empty.textContent = 'ainda sem respostas';
          thread.appendChild(empty);
        } else {
          snap.forEach(d => thread.appendChild(buildReplyItem(d.id, d.data(), post.docId)));
        }
      } catch (e) {
        showToast('erro ao carregar respostas', 'error');
      }

      section.appendChild(thread);
      section.appendChild(buildReplyComposer(post.docId, thread, post));
    }

    function buildReplyItem(replyId, r, postId) {
      const item = document.createElement('div');
      item.className = 'thread-item';

      const av = document.createElement('div');
      av.className = 'avatar avatar-sm';
      av.style.backgroundImage = gradientCSS(r.gradient);
      item.appendChild(av);

      const body = document.createElement('div');
      body.className = 'reply-body';
      body.innerHTML = `
        <div class="reply-header">
          <span class="reply-author">${escapeHTML(r.author || 'anônimo')}</span>
          <span class="reply-time">${formatTimeAbs(r.createdAt)}</span>
        </div>
        <div class="reply-content">
          ${r.type === 'drawing'
            ? `<img class="post-drawing" src="${r.message}" alt="desenho" loading="lazy" />`
            : escapeHTML(r.message || '')
          }
        </div>
      `;
      item.appendChild(body);

      const delBtn = document.createElement('button');
      delBtn.className = 'reply-delete';
      delBtn.textContent = '✕';
      delBtn.title = `deletar resposta de @${r.author || 'anônimo'}`;
      delBtn.addEventListener('click', async () => {
        if (!confirm(`Deletar resposta de @${r.author || 'anônimo'}?`)) return;
        try {
          await deleteDoc(doc(db, POSTS, postId, 'replies', replyId));
          item.remove();
          showToast('resposta deletada', 'success');
        } catch (e) {
          showToast('erro: ' + e.message, 'error');
        }
      });
      item.appendChild(delBtn);

      return item;
    }

    function buildReplyComposer(postId, threadEl, post) {
      const wrap = document.createElement('div');
      wrap.className = 'reply-composer';

      const av = document.createElement('div');
      av.className = 'avatar avatar-sm';
      av.style.backgroundImage = modProfile ? gradientCSS(modProfile.gradient) : '';
      wrap.appendChild(av);

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'reply-input';
      input.placeholder = 'escrever resposta…';
      input.maxLength = 200;
      wrap.appendChild(input);

      const send = document.createElement('button');
      send.className = 'reply-send';
      send.disabled = true;
      send.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>`;
      wrap.appendChild(send);

      input.addEventListener('input', () => { send.disabled = input.value.trim().length === 0; });

      const submit = async () => {
        const txt = input.value.trim();
        if (!txt || !modProfile) return;
        send.disabled = true;
        try {
          await addDoc(collection(db, POSTS, postId, 'replies'), {
            type: 'text', message: txt,
            author: modProfile.name, authorId: modProfile.id,
            gradient: modProfile.gradient, createdAt: serverTimestamp(),
          });
          await updateDoc(doc(db, POSTS, postId), { replyCount: increment(1) });
          threadEl.querySelector('.replies-empty')?.remove();
          const fakeTs = { toDate: () => new Date() };
          threadEl.appendChild(buildReplyItem('_local_' + Date.now(), {
            type: 'text', message: txt,
            author: modProfile.name, gradient: modProfile.gradient,
            createdAt: fakeTs,
          }, postId));
          const localPost = allPosts.find(p => p.docId === postId);
          if (localPost) localPost.replyCount = (localPost.replyCount || 0) + 1;
          post.replyCount = (post.replyCount || 0) + 1;
          input.value = '';
          showToast('resposta enviada!', 'success');
        } catch (e) {
          showToast('erro: ' + e.message, 'error');
        } finally {
          send.disabled = input.value.trim().length === 0;
        }
      };

      send.addEventListener('click', submit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });

      return wrap;
    }

    // ── Delete post ──
    function confirmDelete(post, el) {
      const preview = post.type === 'drawing' ? '[desenho]' : `"${(post.message || '').slice(0, 60)}…"`;
      openConfirm(
        'Deletar post?',
        `De @${post.author || 'anônimo'}: ${preview}\n\nEsta ação é permanente.`,
        () => doDeletePost(post, el)
      );
    }

    async function doDeletePost(post, el) {
      el.classList.add('deleting');
      try {
        await deleteDoc(doc(db, POSTS, post.docId));
        allPosts = allPosts.filter(p => p.docId !== post.docId);
        el.remove();
        showToast('post deletado', 'success');
      } catch (e) {
        el.classList.remove('deleting');
        showToast('erro: ' + e.message, 'error');
      }
    }

    // ── Events ──
    refreshBtn.addEventListener('click', loadPosts);
    searchInput.addEventListener('input', renderPosts);
    filterSelect.addEventListener('change', renderPosts);
  </script>

</body>
</html>
