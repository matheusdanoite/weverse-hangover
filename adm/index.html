<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ADM — Weverse Hangover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink-neon: #ff2d78;
      --pink-glow: #ff2d7840;
      --purple-deep: #0d0015;
      --purple-mid: #1a0a2e;
      --purple-accent: #9b59ff;
      --blue-electric: #00d4ff;
      --red: #ff3b3b;
      --green: #34e89e;
      --bg: #1a0a2e;
      --surface-1: rgba(255,255,255,0.04);
      --surface-2: rgba(255,255,255,0.07);
      --surface-hover: rgba(255,255,255,0.10);
      --border-subtle: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.18);
      --text-primary: #f0e6ff;
      --text-secondary: rgba(240,230,255,0.65);
      --text-muted: rgba(240,230,255,0.4);
      --font-main: 'Outfit','Noto Sans KR',sans-serif;
    }
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100%; min-height:100dvh; font-family:var(--font-main); background:var(--bg); color:var(--text-primary); -webkit-font-smoothing:antialiased; }
    button { font-family:inherit; cursor:pointer; border:none; }
    .hidden { display:none !important; }

    /* ── Login ── */
    .login-screen {
      min-height:100dvh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:32px;
    }
    .login-brand { text-align:center; }
    .login-brand .w1 { display:block; font-size:2rem; font-weight:800; letter-spacing:.12em; color:var(--pink-neon); text-shadow:0 0 20px var(--pink-glow); }
    .login-brand .w2 { display:block; font-size:2rem; font-weight:300; letter-spacing:.22em; color:var(--purple-accent); }
    .login-brand .tag { display:block; font-size:.75rem; letter-spacing:.2em; color:var(--text-muted); margin-top:8px; text-transform:uppercase; }
    .login-btn {
      display:flex; align-items:center; gap:12px;
      background:var(--surface-2); border:1px solid var(--border-strong);
      color:var(--text-primary); padding:14px 28px; border-radius:12px;
      font-size:1rem; font-weight:600; transition:background .2s;
    }
    .login-btn:hover { background:var(--surface-hover); }

    /* ── Shell ── */
    .shell { max-width:860px; margin:0 auto; padding:20px 16px 80px; }

    /* ── Header ── */
    .adm-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:20px; padding-bottom:14px;
      border-bottom:1px solid var(--border-subtle);
      gap:10px; flex-wrap:wrap;
    }
    .adm-brand .w1 { font-size:1.05rem; font-weight:800; color:var(--pink-neon); }
    .adm-brand .w2 { font-size:1.05rem; font-weight:300; color:var(--purple-accent); }
    .adm-brand .tag { font-size:.6rem; letter-spacing:.15em; color:var(--text-muted); text-transform:uppercase; }
    .header-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .adm-email { font-size:.75rem; color:var(--text-muted); }

    /* ── Tools toggle button ── */
    .btn-tools {
      display:flex; align-items:center; gap:6px;
      background:var(--surface-1); border:1px solid var(--border-subtle);
      color:var(--text-secondary); padding:7px 14px; border-radius:8px;
      font-size:.82rem; font-weight:600; transition:background .2s, border-color .2s, color .2s;
    }
    .btn-tools:hover { background:var(--surface-hover); }
    .btn-tools.active {
      background:rgba(155,89,255,0.12); border-color:rgba(155,89,255,0.4);
      color:var(--purple-accent);
    }
    .btn-tools .chevron {
      transition:transform .25s;
    }
    .btn-tools.active .chevron { transform:rotate(180deg); }

    .btn-logout {
      background:var(--surface-1); border:1px solid var(--border-subtle);
      color:var(--text-secondary); padding:7px 14px; border-radius:8px;
      font-size:.8rem; transition:background .2s;
    }
    .btn-logout:hover { background:var(--surface-hover); }

    /* ── Tools panel (collapsible) ── */
    .tools-panel {
      overflow:hidden;
      max-height:0;
      opacity:0;
      transition:max-height .35s ease, opacity .25s ease, margin .25s ease;
      margin-bottom:0;
    }
    .tools-panel.open {
      max-height:600px;
      opacity:1;
      margin-bottom:20px;
    }
    .tools-inner {
      border:1px solid var(--border-subtle);
      border-radius:14px;
      padding:16px;
      background:var(--surface-1);
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    /* Stats */
    .stats-bar { display:flex; gap:10px; flex-wrap:wrap; }
    .stat-card {
      flex:1; min-width:120px; background:var(--surface-2);
      border:1px solid var(--border-subtle); border-radius:10px;
      padding:12px 16px;
    }
    .stat-value { font-size:1.6rem; font-weight:700; color:var(--pink-neon); line-height:1; }
    .stat-label { font-size:.7rem; color:var(--text-muted); margin-top:3px; }

    /* Controls */
    .controls-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .search-input {
      flex:1; min-width:180px; background:var(--surface-2);
      border:1px solid var(--border-subtle); border-radius:8px;
      color:var(--text-primary); padding:9px 12px; font-size:.88rem;
      outline:none; transition:border-color .2s; font-family:inherit;
    }
    .search-input:focus { border-color:var(--purple-accent); }
    .search-input::placeholder { color:var(--text-muted); }
    .filter-select {
      background:var(--surface-2); border:1px solid var(--border-subtle);
      border-radius:8px; color:var(--text-primary); padding:9px 12px;
      font-size:.88rem; font-family:inherit; outline:none; cursor:pointer;
    }
    .filter-select option { background:#1a0a2e; }
    .btn-refresh {
      background:var(--surface-2); border:1px solid var(--border-subtle);
      color:var(--text-secondary); padding:9px 14px; border-radius:8px;
      font-size:.82rem; display:flex; align-items:center; gap:5px;
      transition:background .2s;
    }
    .btn-refresh:hover { background:var(--surface-hover); }

    .posts-count-tools { font-size:.75rem; color:var(--text-muted); }

    /* ── Composer ── */
    .compose-section {
      background:var(--surface-1); border:1px solid var(--border-subtle);
      border-radius:14px; padding:14px; margin-bottom:16px;
    }
    .compose-row { display:flex; gap:12px; align-items:flex-start; }
    .compose-avatar {
      width:36px; height:36px; border-radius:50%; flex-shrink:0;
      border:1.5px solid rgba(255,255,255,0.15);
    }
    .compose-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
    .compose-textarea {
      width:100%; background:transparent; border:none; outline:none;
      color:var(--text-primary); font-family:inherit; font-size:.95rem;
      line-height:1.5; resize:none; min-height:44px;
      caret-color:var(--pink-neon);
    }
    .compose-textarea::placeholder { color:var(--text-muted); }
    .compose-footer {
      display:flex; justify-content:flex-end; align-items:center; gap:10px;
      border-top:1px solid var(--border-subtle); padding-top:8px;
    }
    .compose-count { font-size:.75rem; color:var(--text-muted); }
    .compose-count.over { color:var(--red); }
    .compose-btn {
      background:var(--pink-neon); color:#fff;
      padding:7px 20px; border-radius:20px;
      font-size:.85rem; font-weight:700; letter-spacing:.04em;
      transition:opacity .15s, transform .1s;
    }
    .compose-btn:disabled { opacity:.4; cursor:not-allowed; }
    .compose-btn:not(:disabled):hover { opacity:.85; }
    .compose-btn:not(:disabled):active { transform:scale(.97); }

    /* ── Post list ── */
    .post-list { display:flex; flex-direction:column; gap:10px; }
    .post-item {
      background:var(--surface-1); border:1px solid var(--border-subtle);
      border-radius:12px; padding:14px;
      display:flex; align-items:flex-start; gap:12px;
      transition:border-color .2s;
    }
    .post-item:hover { border-color:var(--border-strong); }
    .post-item.deleting { opacity:.4; pointer-events:none; }

    .post-avatar { width:36px; height:36px; border-radius:50%; flex-shrink:0; }
    .post-body { flex:1; min-width:0; }
    .post-meta { display:flex; align-items:center; gap:7px; margin-bottom:5px; flex-wrap:wrap; }
    .post-author { font-weight:700; font-size:.88rem; }
    .post-time { font-size:.72rem; color:var(--text-muted); }
    .post-doc-id {
      font-size:.6rem; color:var(--text-muted); font-family:monospace;
      display:none; /* shown via .tools-active */
    }
    .badge-drawing {
      font-size:.62rem; padding:2px 6px; border-radius:20px; font-weight:600;
      background:rgba(0,212,255,.12); color:var(--blue-electric); border:1px solid rgba(0,212,255,.2);
    }
    .post-content {
      font-size:.88rem; color:var(--text-secondary); line-height:1.45;
      word-break:break-word; white-space:pre-wrap;
      max-height:80px; overflow:hidden;
    }
    .post-content.drawing-preview img { height:56px; border-radius:6px; display:block; margin-top:4px; }
    .post-counts { display:flex; gap:12px; margin-top:7px; }
    .post-count { font-size:.72rem; color:var(--text-muted); display:flex; align-items:center; gap:3px; }
    .post-count.has-val { color:var(--pink-neon); }

    .post-actions { display:flex; flex-direction:column; gap:5px; flex-shrink:0; align-items:flex-end; }

    /* Reply toggle button — always visible */
    .btn-reply-toggle {
      background:var(--surface-1); border:1px solid var(--border-subtle);
      color:var(--text-muted); padding:6px 12px; border-radius:8px;
      font-size:.75rem; transition:background .2s, color .15s;
      white-space:nowrap;
    }
    .btn-reply-toggle:hover { background:var(--surface-hover); color:var(--text-secondary); }
    .btn-reply-toggle.active {
      background:rgba(155,89,255,.1); border-color:rgba(155,89,255,.3);
      color:var(--purple-accent);
    }

    /* Delete button — only visible when tools active */
    .btn-delete {
      background:rgba(255,59,59,.1); border:1px solid rgba(255,59,59,.22);
      color:var(--red); padding:6px 12px; border-radius:8px;
      font-size:.75rem; font-weight:600; display:none; /* tools-active shows it */
      align-items:center; gap:5px; transition:background .2s;
      white-space:nowrap;
    }
    .btn-delete:hover { background:rgba(255,59,59,.22); }

    /* when tools mode is on */
    .tools-active .post-doc-id { display:inline; }
    .tools-active .btn-delete { display:flex; }

    /* ── Replies panel ── */
    .replies-panel {
      margin-top:10px;
      border-top:1px solid var(--border-subtle);
      padding-top:10px;
    }
    .reply-thread { display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
    .reply-item { display:flex; gap:9px; align-items:flex-start; }
    .reply-item-avatar { width:28px; height:28px; border-radius:50%; flex-shrink:0; }
    .reply-item-body { flex:1; min-width:0; }
    .reply-item-header { display:flex; align-items:center; gap:6px; margin-bottom:3px; flex-wrap:wrap; }
    .reply-item-author { font-size:.8rem; font-weight:700; }
    .reply-item-time { font-size:.68rem; color:var(--text-muted); }
    .reply-item-text { font-size:.82rem; color:var(--text-secondary); word-break:break-word; white-space:pre-wrap; }
    .btn-delete-reply {
      background:rgba(255,59,59,.08); border:1px solid rgba(255,59,59,.18);
      color:var(--red); padding:3px 9px; border-radius:6px; font-size:.7rem;
      flex-shrink:0; transition:background .15s; align-self:flex-start; margin-top:2px;
    }
    .btn-delete-reply:hover { background:rgba(255,59,59,.18); }
    .replies-empty { font-size:.8rem; color:var(--text-muted); padding:4px 0 8px; }

    /* Reply composer */
    .reply-composer {
      display:flex; gap:8px; align-items:center;
      border-top:1px solid var(--border-subtle); padding-top:10px;
    }
    .reply-composer-avatar { width:28px; height:28px; border-radius:50%; flex-shrink:0; }
    .reply-composer-input {
      flex:1; background:var(--surface-2); border:1px solid var(--border-subtle);
      border-radius:20px; color:var(--text-primary); padding:7px 14px;
      font-size:.82rem; font-family:inherit; outline:none;
      transition:border-color .2s;
    }
    .reply-composer-input:focus { border-color:var(--purple-accent); }
    .reply-composer-input::placeholder { color:var(--text-muted); }
    .reply-composer-send {
      background:var(--pink-neon); color:#fff; border-radius:50%;
      width:32px; height:32px; flex-shrink:0; display:flex;
      align-items:center; justify-content:center;
      transition:opacity .15s;
    }
    .reply-composer-send:disabled { opacity:.35; cursor:not-allowed; }
    .reply-composer-send:not(:disabled):hover { opacity:.8; }

    /* ── Loading / empty ── */
    .state-loading { text-align:center; padding:50px 20px; color:var(--text-muted); }
    .state-empty { text-align:center; padding:50px 20px; color:var(--text-muted); }
    .spinner { animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Toast ── */
    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(16px);
      background:rgba(20,8,40,.97); border:1px solid var(--border-strong);
      color:var(--text-primary); padding:9px 18px; border-radius:20px;
      font-size:.83rem; opacity:0; transition:opacity .2s, transform .2s;
      pointer-events:none; z-index:9999; white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.success { border-color:rgba(52,232,158,.4); color:var(--green); }
    .toast.error { border-color:rgba(255,59,59,.4); color:var(--red); }

    /* ── Confirm modal ── */
    .confirm-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.72);
      display:flex; align-items:center; justify-content:center;
      z-index:9998; backdrop-filter:blur(4px);
    }
    .confirm-card {
      background:#1e0d35; border:1px solid var(--border-strong);
      border-radius:16px; padding:28px 24px; max-width:340px; width:90%; text-align:center;
    }
    .confirm-icon { font-size:2rem; margin-bottom:10px; }
    .confirm-title { font-size:1.05rem; font-weight:700; margin-bottom:7px; }
    .confirm-desc { font-size:.86rem; color:var(--text-secondary); margin-bottom:18px; line-height:1.5; }
    .confirm-actions { display:flex; gap:10px; justify-content:center; }
    .btn-cancel {
      background:var(--surface-2); border:1px solid var(--border-subtle);
      color:var(--text-secondary); padding:9px 20px; border-radius:10px; font-size:.88rem;
    }
    .btn-confirm-del {
      background:rgba(255,59,59,.15); border:1px solid rgba(255,59,59,.4);
      color:var(--red); padding:9px 20px; border-radius:10px;
      font-size:.88rem; font-weight:700; transition:background .2s;
    }
    .btn-confirm-del:hover { background:rgba(255,59,59,.28); }
  </style>
</head>

<body>

  <!-- Login -->
  <div id="loginScreen" class="login-screen hidden">
    <div class="login-brand">
      <span class="w1">WEVERSE</span>
      <span class="w2">HANGOVER</span>
      <span class="tag">painel administrativo</span>
    </div>
    <button id="loginBtn" class="login-btn">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Entrar com Google
    </button>
  </div>

  <!-- Admin shell -->
  <div id="adminShell" class="shell hidden">

    <header class="adm-header">
      <div class="adm-brand">
        <span class="w1">WEVERSE </span><span class="w2">HANGOVER</span>
        <div class="tag">painel administrativo</div>
      </div>
      <div class="header-right">
        <button id="toolsToggle" class="btn-tools" title="Ferramentas de moderação">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
          Ferramentas
          <svg class="chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <span class="adm-email" id="adminEmail"></span>
        <button id="logoutBtn" class="btn-logout">sair</button>
      </div>
    </header>

    <!-- Collapsible tools panel -->
    <div id="toolsPanel" class="tools-panel">
      <div class="tools-inner">
        <div class="stats-bar">
          <div class="stat-card"><div class="stat-value" id="statTotal">—</div><div class="stat-label">posts no total</div></div>
          <div class="stat-card"><div class="stat-value" id="statUsers">—</div><div class="stat-label">usuários únicos</div></div>
          <div class="stat-card"><div class="stat-value" id="statDrawings">—</div><div class="stat-label">desenhos</div></div>
          <div class="stat-card"><div class="stat-value" id="statLikes">—</div><div class="stat-label">curtidas totais</div></div>
        </div>
        <div class="controls-bar">
          <input type="search" id="searchInput" class="search-input" placeholder="buscar por autor ou conteúdo…" />
          <select id="filterSelect" class="filter-select">
            <option value="all">todos os posts</option>
            <option value="text">só textos</option>
            <option value="drawing">só desenhos</option>
          </select>
          <button id="refreshBtn" class="btn-refresh">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            atualizar
          </button>
        </div>
        <div class="posts-count-tools" id="postsCountTools"></div>
      </div>
    </div>

    <!-- Composer -->
    <section class="compose-section">
      <div class="compose-row">
        <div class="compose-avatar" id="composeAvatar"></div>
        <div class="compose-body">
          <textarea id="composeText" class="compose-textarea" maxlength="300"
            placeholder="diga algo para a galera…" rows="2"></textarea>
          <div class="compose-footer">
            <span class="compose-count" id="composeCount">0/300</span>
            <button id="composeBtn" class="compose-btn" disabled>postar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Feed -->
    <div id="postList" class="post-list"></div>

  </div>

  <!-- Loading -->
  <div id="loadingScreen" class="state-loading">
    <svg class="spinner" width="32" height="32" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" stroke="rgba(255,45,120,0.3)" stroke-width="3" fill="none"/>
      <path d="M12 2a10 10 0 0 1 10 10" stroke="#ff2d78" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <p style="margin-top:12px;font-size:.85rem">carregando…</p>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Confirm modal -->
  <div id="confirmOverlay" class="confirm-overlay hidden">
    <div class="confirm-card">
      <div class="confirm-icon">🗑️</div>
      <div class="confirm-title" id="confirmTitle">Deletar post?</div>
      <div class="confirm-desc" id="confirmDesc">Esta ação é permanente.</div>
      <div class="confirm-actions">
        <button id="confirmCancel" class="btn-cancel">cancelar</button>
        <button id="confirmOk" class="btn-confirm-del">deletar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
    import {
      getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
      serverTimestamp, query, orderBy, getDocs, limit, increment
    } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';

    const firebaseConfig = await fetch('/api/config').then(r => r.json());

    const MODERATORS = {
      'matheusdanoite@gmail.com': { id: 'adm_matheusdanoite', name: 'matheusdanoite', gradient: ['#ffffff', '#1a1a1a'] },
      'anacgiy@gmail.com':        { id: 'adm_anithesun',      name: 'anithesun',      gradient: ['#e8153a', '#96f7a0'] },
    };
    const POSTS = 'hangul_messages';

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ── DOM ──
    const loginScreen    = document.getElementById('loginScreen');
    const adminShell     = document.getElementById('adminShell');
    const loadingScreen  = document.getElementById('loadingScreen');
    const loginBtn       = document.getElementById('loginBtn');
    const logoutBtn      = document.getElementById('logoutBtn');
    const adminEmailEl   = document.getElementById('adminEmail');
    const toolsToggle    = document.getElementById('toolsToggle');
    const toolsPanel     = document.getElementById('toolsPanel');
    const searchInput    = document.getElementById('searchInput');
    const filterSelect   = document.getElementById('filterSelect');
    const refreshBtn     = document.getElementById('refreshBtn');
    const postList       = document.getElementById('postList');
    const postsCountTools= document.getElementById('postsCountTools');
    const statTotal      = document.getElementById('statTotal');
    const statUsers      = document.getElementById('statUsers');
    const statDrawings   = document.getElementById('statDrawings');
    const statLikes      = document.getElementById('statLikes');
    const composeAvatar  = document.getElementById('composeAvatar');
    const composeText    = document.getElementById('composeText');
    const composeCount   = document.getElementById('composeCount');
    const composeBtn     = document.getElementById('composeBtn');
    const toastEl        = document.getElementById('toast');
    const confirmOverlay = document.getElementById('confirmOverlay');
    const confirmTitle   = document.getElementById('confirmTitle');
    const confirmDesc    = document.getElementById('confirmDesc');
    const confirmCancel  = document.getElementById('confirmCancel');
    const confirmOk      = document.getElementById('confirmOk');

    let allPosts       = [];
    let modProfile     = null;
    let toolsOpen      = false;
    let pendingConfirm = null;
    let toastTimer     = null;

    // ── Helpers ──
    function gradientCSS(g) {
      return (!g || g.length !== 2)
        ? 'linear-gradient(135deg,#ff2d78,#9b59ff)'
        : `linear-gradient(135deg,${g[0]},${g[1]})`;
    }
    function formatTime(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts.seconds * 1000);
      return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
    }
    function escapeHTML(s) {
      const el = document.createElement('div');
      el.textContent = s;
      return el.innerHTML;
    }

    // ── Toast ──
    function showToast(text, type = '') {
      toastEl.textContent = text;
      toastEl.className = 'toast show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    // ── Confirm ──
    function openConfirm(title, desc, onOk) {
      confirmTitle.textContent = title;
      confirmDesc.textContent  = desc;
      confirmOverlay.classList.remove('hidden');
      pendingConfirm = onOk;
    }
    confirmCancel.addEventListener('click', () => {
      confirmOverlay.classList.add('hidden');
      pendingConfirm = null;
    });
    confirmOk.addEventListener('click', () => {
      confirmOverlay.classList.add('hidden');
      if (pendingConfirm) { pendingConfirm(); pendingConfirm = null; }
    });

    // ── Auth ──
    loginBtn.addEventListener('click', async () => {
      try { await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch (e) { showToast('erro ao entrar: ' + e.message, 'error'); }
    });
    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        loadingScreen.classList.add('hidden');
        loginScreen.classList.remove('hidden');
        adminShell.classList.add('hidden');
        return;
      }
      if (!MODERATORS[user.email]) {
        await signOut(auth);
        showToast('acesso negado', 'error');
        loadingScreen.classList.add('hidden');
        loginScreen.classList.remove('hidden');
        return;
      }
      modProfile = MODERATORS[user.email];
      loginScreen.classList.add('hidden');
      loadingScreen.classList.add('hidden');
      adminShell.classList.remove('hidden');
      adminEmailEl.textContent = user.email;
      composeAvatar.style.backgroundImage = gradientCSS(modProfile.gradient);
      loadPosts();
    });

    // ── Tools toggle ──
    toolsToggle.addEventListener('click', () => {
      toolsOpen = !toolsOpen;
      toolsToggle.classList.toggle('active', toolsOpen);
      toolsPanel.classList.toggle('open', toolsOpen);
      adminShell.classList.toggle('tools-active', toolsOpen);
    });

    // ── Composer ──
    composeText.addEventListener('input', () => {
      const len = composeText.value.length;
      composeCount.textContent = `${len}/300`;
      composeCount.classList.toggle('over', len > 300);
      composeBtn.disabled = len === 0 || len > 300;
      composeText.style.height = 'auto';
      composeText.style.height = composeText.scrollHeight + 'px';
    });

    composeBtn.addEventListener('click', async () => {
      const text = composeText.value.trim();
      if (!text || !modProfile) return;
      composeBtn.disabled = true;
      composeBtn.textContent = '…';
      try {
        await addDoc(collection(db, POSTS), {
          type: 'text',
          message: text,
          author: modProfile.name,
          authorId: modProfile.id,
          gradient: modProfile.gradient,
          likedBy: [],
          replyCount: 0,
          createdAt: serverTimestamp(),
        });
        composeText.value = '';
        composeText.style.height = 'auto';
        composeCount.textContent = '0/300';
        showToast('postado!', 'success');
        await loadPosts();
      } catch (e) {
        showToast('erro ao postar: ' + e.message, 'error');
      } finally {
        composeBtn.disabled = false;
        composeBtn.textContent = 'postar';
      }
    });

    // ── Load posts ──
    async function loadPosts() {
      postList.innerHTML = `<div class="state-loading">
        <svg class="spinner" width="26" height="26" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke="rgba(255,45,120,0.3)" stroke-width="3" fill="none"/>
          <path d="M12 2a10 10 0 0 1 10 10" stroke="#ff2d78" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg></div>`;
      try {
        const q    = query(collection(db, POSTS), orderBy('createdAt', 'desc'), limit(120));
        const snap = await getDocs(q);
        allPosts   = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
        updateStats();
        renderPosts();
      } catch (e) {
        postList.innerHTML = `<div class="state-empty"><p>erro: ${e.message}</p></div>`;
        showToast('erro ao carregar', 'error');
      }
    }

    // ── Stats ──
    function updateStats() {
      const users    = new Set(allPosts.map(p => p.authorId)).size;
      const drawings = allPosts.filter(p => p.type === 'drawing').length;
      const likes    = allPosts.reduce((a, p) => a + (p.likedBy?.length || 0), 0);
      statTotal.textContent    = allPosts.length;
      statUsers.textContent    = users;
      statDrawings.textContent = drawings;
      statLikes.textContent    = likes;
    }

    // ── Render feed ──
    function renderPosts() {
      const search = searchInput.value.toLowerCase().trim();
      const filter = filterSelect.value;
      const filtered = allPosts.filter(p => {
        if (filter === 'text'    && p.type !== 'text')    return false;
        if (filter === 'drawing' && p.type !== 'drawing') return false;
        if (search) {
          const ok = (p.author || '').toLowerCase().includes(search)
                  || (p.message || '').toLowerCase().includes(search);
          if (!ok) return false;
        }
        return true;
      });
      postsCountTools.textContent = `${filtered.length} post${filtered.length !== 1 ? 's' : ''}`;
      if (!filtered.length) {
        postList.innerHTML = `<div class="state-empty"><p>nenhum post encontrado</p></div>`;
        return;
      }
      postList.innerHTML = '';
      filtered.forEach(p => postList.appendChild(buildPostItem(p)));
    }

    // ── Build post card ──
    function buildPostItem(post) {
      const isDrawing = post.type === 'drawing';
      const likes     = post.likedBy?.length || 0;
      const replies   = post.replyCount || 0;

      const art = document.createElement('article');
      art.className = 'post-item';
      art.dataset.docId = post.docId;

      // Avatar
      const av = document.createElement('div');
      av.className = 'post-avatar';
      av.style.backgroundImage = gradientCSS(post.gradient);
      art.appendChild(av);

      // Body
      const body = document.createElement('div');
      body.className = 'post-body';
      body.innerHTML = `
        <div class="post-meta">
          <span class="post-author">${escapeHTML(post.author || 'anônimo')}</span>
          <span class="post-time">${formatTime(post.createdAt)}</span>
          ${isDrawing ? '<span class="badge-drawing">desenho</span>' : ''}
          <span class="post-doc-id">${post.docId}</span>
        </div>
        <div class="post-content${isDrawing ? ' drawing-preview' : ''}">
          ${isDrawing
            ? `<img src="${post.message}" alt="desenho" loading="lazy"/>`
            : escapeHTML((post.message || '').slice(0, 200)) + ((post.message||'').length > 200 ? '…' : '')}
        </div>
        <div class="post-counts">
          <span class="post-count ${likes > 0 ? 'has-val' : ''}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="${likes > 0 ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>${likes}
          </span>
          <span class="post-count ${replies > 0 ? 'has-val' : ''}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>${replies}
          </span>
        </div>
      `;
      art.appendChild(body);

      // Actions column
      const actions = document.createElement('div');
      actions.className = 'post-actions';

      // Reply toggle (always visible)
      const replyBtn = document.createElement('button');
      replyBtn.className = 'btn-reply-toggle';
      replyBtn.textContent = replies > 0 ? `💬 ${replies}` : '💬';
      replyBtn.addEventListener('click', () => toggleRepliesPanel(post, body, replyBtn));
      actions.appendChild(replyBtn);

      // Delete (hidden until tools open)
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-delete';
      delBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg> deletar`;
      delBtn.addEventListener('click', () => confirmDelete(post, art));
      actions.appendChild(delBtn);

      art.appendChild(actions);
      return art;
    }

    // ── Replies panel ──
    async function toggleRepliesPanel(post, bodyEl, btn) {
      const existing = bodyEl.querySelector('.replies-panel');
      if (existing) {
        existing.remove();
        btn.classList.remove('active');
        btn.textContent = post.replyCount > 0 ? `💬 ${post.replyCount}` : '💬';
        return;
      }

      btn.classList.add('active');
      btn.textContent = '…';

      const panel = document.createElement('div');
      panel.className = 'replies-panel';

      // Thread
      const thread = document.createElement('div');
      thread.className = 'reply-thread';

      try {
        const q    = query(collection(db, POSTS, post.docId, 'replies'), orderBy('createdAt', 'asc'));
        const snap = await getDocs(q);

        if (snap.empty) {
          const empty = document.createElement('p');
          empty.className = 'replies-empty';
          empty.textContent = 'ainda sem respostas';
          thread.appendChild(empty);
        } else {
          snap.forEach(d => thread.appendChild(buildReplyItem(d.id, d.data(), post.docId, thread)));
        }
      } catch (e) {
        showToast('erro ao carregar respostas', 'error');
      }

      // Reply composer
      const composer = buildReplyComposer(post.docId, thread, btn, post);

      panel.appendChild(thread);
      panel.appendChild(composer);
      bodyEl.appendChild(panel);

      btn.textContent = '✕ fechar';
    }

    function buildReplyItem(replyId, r, postId, threadEl) {
      const item = document.createElement('div');
      item.className = 'reply-item';

      const av = document.createElement('div');
      av.className = 'reply-item-avatar';
      av.style.backgroundImage = gradientCSS(r.gradient);
      item.appendChild(av);

      const bodyD = document.createElement('div');
      bodyD.className = 'reply-item-body';
      bodyD.innerHTML = `
        <div class="reply-item-header">
          <span class="reply-item-author">${escapeHTML(r.author || 'anônimo')}</span>
          <span class="reply-item-time">${formatTime(r.createdAt)}</span>
        </div>
        <div class="reply-item-text">
          ${r.type === 'drawing' ? '[desenho]' : escapeHTML(r.message || '')}
        </div>
      `;
      item.appendChild(bodyD);

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-delete-reply';
      delBtn.textContent = '✕';
      delBtn.title = `deletar resposta de @${r.author || 'anônimo'}`;
      delBtn.addEventListener('click', async () => {
        if (!confirm(`Deletar resposta de @${r.author || 'anônimo'}?`)) return;
        try {
          await deleteDoc(doc(db, POSTS, postId, 'replies', replyId));
          item.remove();
          showToast('resposta deletada', 'success');
        } catch (e) {
          showToast('erro: ' + e.message, 'error');
        }
      });
      item.appendChild(delBtn);

      return item;
    }

    function buildReplyComposer(postId, threadEl, toggleBtn, post) {
      const wrap = document.createElement('div');
      wrap.className = 'reply-composer';

      const av = document.createElement('div');
      av.className = 'reply-composer-avatar';
      av.style.backgroundImage = modProfile ? gradientCSS(modProfile.gradient) : '';
      wrap.appendChild(av);

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'reply-composer-input';
      input.placeholder = 'escrever resposta…';
      input.maxLength = 200;
      wrap.appendChild(input);

      const send = document.createElement('button');
      send.className = 'reply-composer-send';
      send.disabled = true;
      send.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>`;
      wrap.appendChild(send);

      input.addEventListener('input', () => { send.disabled = input.value.trim().length === 0; });

      const submit = async () => {
        const txt = input.value.trim();
        if (!txt || !modProfile) return;
        send.disabled = true;
        try {
          await addDoc(collection(db, POSTS, postId, 'replies'), {
            type: 'text',
            message: txt,
            author: modProfile.name,
            authorId: modProfile.id,
            gradient: modProfile.gradient,
            createdAt: serverTimestamp(),
          });
          await updateDoc(doc(db, POSTS, postId), { replyCount: increment(1) });

          // Remove empty placeholder if present
          threadEl.querySelector('.replies-empty')?.remove();

          // Append new reply to thread
          const fakeTs = { toDate: () => new Date() };
          const newItem = buildReplyItem('_local_' + Date.now(), {
            type: 'text', message: txt,
            author: modProfile.name, gradient: modProfile.gradient,
            createdAt: fakeTs,
          }, postId, threadEl);
          threadEl.appendChild(newItem);

          // Update local replyCount
          const localPost = allPosts.find(p => p.docId === postId);
          if (localPost) localPost.replyCount = (localPost.replyCount || 0) + 1;

          // Update toggle button label
          const newCount = (post.replyCount || 0) + 1;
          post.replyCount = newCount;

          input.value = '';
          showToast('resposta enviada!', 'success');
        } catch (e) {
          showToast('erro: ' + e.message, 'error');
        } finally {
          send.disabled = input.value.trim().length === 0;
        }
      };

      send.addEventListener('click', submit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });

      return wrap;
    }

    // ── Delete post ──
    function confirmDelete(post, el) {
      const preview = post.type === 'drawing' ? '[desenho]' : `"${(post.message || '').slice(0, 60)}…"`;
      openConfirm(
        'Deletar post?',
        `De @${post.author || 'anônimo'}: ${preview}\n\nEsta ação é permanente.`,
        () => doDeletePost(post, el)
      );
    }
    async function doDeletePost(post, el) {
      el.classList.add('deleting');
      try {
        await deleteDoc(doc(db, POSTS, post.docId));
        allPosts = allPosts.filter(p => p.docId !== post.docId);
        el.remove();
        updateStats();
        showToast('post deletado', 'success');
      } catch (e) {
        el.classList.remove('deleting');
        showToast('erro: ' + e.message, 'error');
      }
    }

    // ── Events ──
    refreshBtn.addEventListener('click', loadPosts);
    searchInput.addEventListener('input', renderPosts);
    filterSelect.addEventListener('change', renderPosts);
  </script>

</body>
</html>
