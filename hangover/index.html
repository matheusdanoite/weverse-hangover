<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <title>Weverse Hangover</title>
  <meta name="description" content="Mural ao vivo da Hangul Hangover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700;800&family=Outfit:wght@300;400;600;700;800;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./board.css" />
</head>
<body>
  <div class="kinetic-bg tint-default" id="kineticBg"></div>

  <header class="board-header">
    <div class="header-left">
      <span class="live-dot-hd"></span>
      <div class="wordmark">
        <span class="wm-weverse">WEVERSE</span>
        <span class="wm-hangover">HANGOVER</span>
      </div>
    </div>
    <div class="header-right">
      <div class="post-count-badge" id="postCountBadge">
        POSTS: <strong id="postCountVal">–</strong>
      </div>
      <div class="live-time-badge">
        <span class="live-dot-sm"></span>
        AO VIVO · <span id="liveClock">--:--</span>
      </div>
    </div>
  </header>

  <div class="view-label-wrap" id="viewLabelWrap">
    <div class="view-label-text" id="viewLabelText"></div>
    <div class="view-label-sub" id="viewLabelSub"></div>
  </div>

  <main class="board-scene" id="boardGrid"></main>

  <div class="empty-state" id="emptyState">
    <div class="empty-icon">✦</div>
    <p>aguardando o primeiro post...</p>
    <p class="empty-sub">acesse e poste algo</p>
  </div>

  <div class="pause-indicator" id="pauseIndicator">⏸ PAUSADO</div>

  <div class="footer-ticker">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <script type="module" src="./board.js"></script>
</body>
</html>
