<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <title>ADM — Weverse Hangover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/shared.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; min-height: 100dvh;
      background: var(--bg); color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    button { border: none; }

    /* ── Login ── */
    .login-screen {
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 32px;
    }
    .login-brand { text-align: center; }
    .login-brand .w1 { display: block; font-size: 2rem; font-weight: 800; letter-spacing: .12em; color: var(--pink-neon); text-shadow: 0 0 20px var(--pink-glow); }
    .login-brand .w2 { display: block; font-size: 2rem; font-weight: 300; letter-spacing: .22em; color: var(--purple-accent); }
    .login-brand .tag { display: block; font-size: .75rem; letter-spacing: .2em; color: var(--text-muted); margin-top: 8px; text-transform: uppercase; }
    .login-btn {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface-2); border: 1px solid var(--border-strong);
      color: var(--text-primary); padding: 14px 28px; border-radius: 12px;
      font-size: 1rem; font-weight: 600; transition: background .2s;
    }
    .login-btn:hover { background: var(--surface-hover); }

    /* ── Shell ── */
    .shell { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }

    /* ── Header ── */
    .adm-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .adm-brand .w1 { font-size: 1.05rem; font-weight: 800; color: var(--pink-neon); }
    .adm-brand .w2 { font-size: 1.05rem; font-weight: 300; color: var(--purple-accent); }
    .adm-brand .tag { font-size: .6rem; letter-spacing: .15em; color: var(--text-muted); text-transform: uppercase; }

    .btn-reports {
      position: relative;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-1); border: 1px solid var(--border-subtle);
      border-radius: 50%; color: var(--text-secondary);
      transition: background .2s, border-color .2s, color .2s;
      flex-shrink: 0;
    }
    .btn-reports:hover { background: var(--surface-hover); color: var(--text-primary); }

    /* ── Stats bar ── */
    .stats-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .stat-card {
      flex: 1; min-width: 70px; background: var(--surface-2);
      border: 1px solid var(--border-subtle); border-radius: 10px; padding: 10px 12px;
    }
    .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--pink-neon); line-height: 1; }
    .stat-label { font-size: .65rem; color: var(--text-muted); margin-top: 2px; }

    /* ── Controls bar ── */
    .controls-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .search-input {
      flex: 1; min-width: 160px; background: var(--surface-2);
      border: 1px solid var(--border-subtle); border-radius: 8px;
      color: var(--text-primary); padding: 9px 12px; font-size: .88rem;
      outline: none; transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--purple-accent); }
    .search-input::placeholder { color: var(--text-muted); }
    .filter-select {
      background: var(--surface-2); border: 1px solid var(--border-subtle);
      border-radius: 8px; color: var(--text-primary); padding: 9px 12px;
      font-size: .88rem; outline: none; cursor: pointer;
    }
    .filter-select option { background: #1a0a2e; }
    .btn-refresh {
      background: var(--surface-2); border: 1px solid var(--border-subtle);
      color: var(--text-secondary); padding: 9px 14px; border-radius: 8px;
      font-size: .82rem; display: flex; align-items: center; gap: 5px;
      transition: background .2s;
    }
    .btn-refresh:hover { background: var(--surface-hover); }
    .posts-count-tools { font-size: .75rem; color: var(--text-muted); }

    /* ── Admin Composer ── */
    .compose-section {
      background: var(--surface-1); border: 1px solid var(--border-subtle);
      border-radius: 14px; padding: 14px; margin-bottom: 16px;
    }
    .compose-row { display: flex; gap: 12px; align-items: flex-start; }

    .compose-avatar-btn {
      position: relative; width: 42px; height: 42px; flex-shrink: 0;
      cursor: pointer; border-radius: 50%; overflow: hidden;
      border: 1px solid var(--border-strong);
    }
    .compose-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background-size: 130% 130%; background-position: center center;
    }
    .compose-avatar-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.55); color: #fff;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .15s; border-radius: 50%;
    }
    .compose-avatar-btn:hover .compose-avatar-overlay { opacity: 1; }
    .compose-avatar-btn.has-photo .compose-avatar-overlay { opacity: .55; }
    .compose-avatar-btn.has-photo:hover .compose-avatar-overlay { opacity: 1; }

    .compose-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

    .compose-custom-name {
      width: 100%; background: transparent;
      border: none; border-bottom: 1px solid var(--border-subtle);
      outline: none; color: var(--purple-accent);
      font-size: .88rem; font-weight: 600; font-family: inherit;
      padding: 3px 0 6px;
      caret-color: var(--purple-accent);
      transition: border-color .2s;
    }
    .compose-custom-name:focus { border-color: var(--purple-accent); }
    .compose-custom-name::placeholder { color: var(--text-muted); font-weight: 400; }

    .compose-textarea {
      width: 100%; background: transparent; border: none; outline: none;
      color: var(--text-primary); font-size: .95rem; font-family: inherit;
      line-height: 1.5; resize: none; min-height: 44px;
      caret-color: var(--pink-neon);
    }
    .compose-textarea::placeholder { color: var(--text-muted); }
    .compose-footer {
      display: flex; align-items: center; gap: 8px;
      border-top: 1px solid var(--border-subtle); padding-top: 8px;
      flex-wrap: wrap;
    }
    .compose-time-wrap {
      display: flex; align-items: center; gap: 4px;
      color: var(--text-muted); flex: 1; min-width: 0;
    }
    .compose-custom-time {
      background: transparent; border: none; outline: none;
      color: var(--text-muted); font-size: .72rem; font-family: inherit;
      cursor: pointer; min-width: 0;
    }
    .compose-custom-time::-webkit-calendar-picker-indicator { filter: invert(.5); cursor: pointer; }
    .compose-count { font-size: .75rem; color: var(--text-muted); flex-shrink: 0; }
    .compose-count.over { color: var(--red); }
    .compose-btn {
      background: var(--pink-neon); color: #fff;
      padding: 7px 20px; border-radius: 20px; flex-shrink: 0;
      font-size: .85rem; font-weight: 700; letter-spacing: .04em;
      transition: opacity .15s, transform .1s;
    }
    .compose-btn:disabled { opacity: .4; cursor: not-allowed; }
    .compose-btn:not(:disabled):hover { opacity: .85; }
    .compose-btn:not(:disabled):active { transform: scale(.97); }

    /* ── Reports section (inline) ── */
    .reports-section-label {
      font-size: .72rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--red);
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 8px;
    }
    .reports-section-label .reports-count-badge {
      background: rgba(255,59,59,.15); color: var(--red);
      font-size: .65rem; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
    }

    /* ── Post list ── */
    .post-list { display: flex; flex-direction: column; gap: 10px; }
    .post-list .post { border-radius: 12px; }
    .post-list .reply-btn.open { background: rgba(155,89,255,.1); color: var(--purple-accent); }
    .replies-empty { font-size: .8rem; color: var(--text-muted); padding: 4px 0 8px; }

    /* ── Report post item ── */
    .report-post-wrap { display: flex; flex-direction: column; gap: 6px; }
    .report-action-bar { display: flex; gap: 8px; }
    .btn-report-del {
      flex: 1;
      background: rgba(255,59,59,.07); border: 1px solid rgba(255,59,59,.22);
      color: var(--red); padding: 10px 14px; border-radius: 10px;
      font-size: .85rem; font-weight: 600; transition: background .15s;
    }
    .btn-report-del:hover { background: rgba(255,59,59,.16); }
    .btn-report-maintain {
      flex: 1;
      background: rgba(52,232,158,.07); border: 1px solid rgba(52,232,158,.22);
      color: var(--green); padding: 10px 14px; border-radius: 10px;
      font-size: .85rem; font-weight: 600; transition: background .15s;
    }
    .btn-report-maintain:hover { background: rgba(52,232,158,.18); }

    /* ── Loading / empty ── */
    .state-loading { text-align: center; padding: 50px 20px; color: var(--text-muted); }
    .state-empty   { text-align: center; padding: 50px 20px; color: var(--text-muted); }

    /* ── Confirm modal ── */
    .confirm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.72);
      display: flex; align-items: center; justify-content: center;
      z-index: 9998; backdrop-filter: blur(4px);
    }
    .confirm-card {
      background: #1e0d35; border: 1px solid var(--border-strong);
      border-radius: 16px; padding: 28px 24px; max-width: 340px; width: 90%;
    }
    .confirm-icon  { font-size: 2rem; margin-bottom: 10px; text-align: center; }
    .confirm-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 7px; text-align: center; }
    .confirm-desc  { font-size: .86rem; color: var(--text-secondary); margin-bottom: 18px; line-height: 1.5; text-align: center; }
    .confirm-actions { display: flex; gap: 10px; justify-content: center; }
    .btn-cancel {
      background: var(--surface-2); border: 1px solid var(--border-subtle);
      color: var(--text-secondary); padding: 9px 20px; border-radius: 10px; font-size: .88rem;
    }
    .btn-confirm-del {
      background: rgba(255,59,59,.15); border: 1px solid rgba(255,59,59,.4);
      color: var(--red); padding: 9px 20px; border-radius: 10px;
      font-size: .88rem; font-weight: 700; transition: background .2s;
    }
    .btn-confirm-del:hover { background: rgba(255,59,59,.28); }
    .btn-confirm-maintain {
      background: rgba(52,232,158,.12); border: 1px solid rgba(52,232,158,.3);
      color: var(--green); padding: 9px 20px; border-radius: 10px;
      font-size: .88rem; font-weight: 700; transition: background .2s;
    }
    .btn-confirm-maintain:hover { background: rgba(52,232,158,.22); }
    .btn-confirm-maintain:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Manter dialog extras ── */
    .maintain-label {
      display: block; font-size: .78rem; color: var(--text-secondary);
      margin-bottom: 6px; text-align: left;
    }
    .maintain-textarea {
      width: 100%; background: var(--surface-2);
      border: 1px solid var(--border-subtle); border-radius: 8px;
      color: var(--text-primary); padding: 10px 12px;
      font-size: .88rem; line-height: 1.4; resize: none; min-height: 80px;
      outline: none; transition: border-color .2s; margin-bottom: 16px;
    }
    .maintain-textarea:focus { border-color: var(--green); }

    /* ── Tabs ── */
    .tab-bar { display: flex; gap: 4px; margin-bottom: 14px; background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 4px; }
    .tab-btn { flex: 1; padding: 7px; border-radius: 7px; font-size: .82rem; font-weight: 600; color: var(--text-muted); background: transparent; transition: background .15s, color .15s; cursor: pointer; }
    .tab-btn.active { background: var(--surface-2); color: var(--text-primary); }

    /* ── Profile selector ── */
    .profile-selector { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border-subtle); }
    .profile-selector-label { font-size: .68rem; letter-spacing: .1em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .profile-selector-list { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .profile-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--border-subtle); font-size: .78rem; color: var(--text-secondary); cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
    .profile-pill:hover { background: var(--surface-hover); }
    .profile-pill.active { background: rgba(155,89,255,.15); border-color: var(--purple-accent); color: var(--purple-accent); }
    .profile-pill-avatar { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; background-size: 130% 130%; background-position: center; }
    .profile-pill.active .profile-pill-avatar { background-size: cover; }
    .profile-pill-new { color: var(--text-muted); border-style: dashed; }

    /* ── Idol list ── */
    .idol-post-wrap { display: flex; flex-direction: column; gap: 6px; }
    .idol-action-bar { display: flex; gap: 8px; }
    .btn-idol-edit { flex: 1; background: rgba(0,212,255,.07); border: 1px solid rgba(0,212,255,.22); color: #00d4ff; padding: 8px 14px; border-radius: 10px; font-size: .82rem; font-weight: 600; transition: background .15s; cursor: pointer; }
    .btn-idol-edit:hover { background: rgba(0,212,255,.16); }
    .btn-idol-del { flex: 1; background: rgba(255,59,59,.07); border: 1px solid rgba(255,59,59,.22); color: var(--red); padding: 8px 14px; border-radius: 10px; font-size: .82rem; font-weight: 600; transition: background .15s; cursor: pointer; }
    .btn-idol-del:hover { background: rgba(255,59,59,.16); }

    /* ── Inline replies (Idols tab) ── */
    .idol-replies-section { background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 10px 12px; }
    .idol-replies-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--text-muted); cursor: pointer; background: none; border: none; padding: 0; }
    .idol-replies-toggle.open { color: var(--purple-accent); }
    .idol-replies-thread { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .idol-reply-item { display: flex; gap: 8px; align-items: flex-start; }
    .idol-reply-avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; background-size: 130% 130%; background-position: center; }
    .idol-reply-body { flex: 1; min-width: 0; }
    .idol-reply-meta { font-size: .72rem; color: var(--text-muted); margin-bottom: 2px; }
    .idol-reply-author { color: var(--text-primary); font-weight: 600; margin-right: 5px; }
    .idol-reply-text { font-size: .85rem; color: var(--text-primary); word-break: break-word; }
    .idol-reply-del { background: none; border: none; color: var(--text-muted); font-size: .7rem; padding: 2px 4px; cursor: pointer; opacity: .45; flex-shrink: 0; }
    .idol-reply-del:hover { opacity: 1; color: var(--red); }
    .idol-reply-composer { display: flex; gap: 6px; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border-subtle); }
    .idol-reply-input { flex: 1; background: var(--surface-2); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-primary); padding: 7px 10px; font-size: .82rem; font-family: inherit; outline: none; transition: border-color .2s; }
    .idol-reply-input:focus { border-color: var(--purple-accent); }
    .idol-reply-input::placeholder { color: var(--text-muted); }
    .idol-reply-send { background: var(--purple-accent); color: #fff; padding: 7px 14px; border-radius: 8px; font-size: .78rem; font-weight: 700; flex-shrink: 0; transition: opacity .15s; cursor: pointer; }
    .idol-reply-send:disabled { opacity: .35; cursor: not-allowed; }

    /* ── Edit modal ── */
    .edit-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(4px); }
    .edit-modal-card { background: #1e0d35; border: 1px solid var(--border-strong); border-radius: 16px; padding: 24px; max-width: 380px; width: 90%; display: flex; flex-direction: column; gap: 12px; }
    .edit-modal-title { font-size: 1rem; font-weight: 700; }
    .edit-modal-textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-primary); padding: 10px 12px; font-size: .88rem; font-family: inherit; line-height: 1.4; resize: none; min-height: 90px; outline: none; transition: border-color .2s; }
    .edit-modal-textarea:focus { border-color: var(--purple-accent); }
    .edit-modal-time { background: var(--surface-2); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-muted); padding: 9px 12px; font-size: .82rem; font-family: inherit; outline: none; width: 100%; transition: border-color .2s; }
    .edit-modal-time::-webkit-calendar-picker-indicator { filter: invert(.5); cursor: pointer; }
    .edit-modal-time:focus { border-color: var(--purple-accent); }
    .edit-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-edit-cancel { background: var(--surface-2); border: 1px solid var(--border-subtle); color: var(--text-secondary); padding: 8px 18px; border-radius: 8px; font-size: .85rem; cursor: pointer; }
    .btn-edit-save { background: var(--purple-accent); color: #fff; padding: 8px 18px; border-radius: 8px; font-size: .85rem; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .btn-edit-save:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>

<body>

  <!-- Login -->
  <div id="loginScreen" class="login-screen hidden">
    <div class="login-brand">
      <span class="w1">WEVERSE</span>
      <span class="w2">HANGOVER</span>
      <span class="tag">painel administrativo</span>
    </div>
    <button id="loginBtn" class="login-btn">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Entrar com Google
    </button>
  </div>

  <!-- Admin shell -->
  <div id="adminShell" class="shell hidden">

    <header class="adm-header">
      <div class="adm-brand">
        <span class="w1">WEVERSE </span><span class="w2">HANGOVER</span>
        <div class="tag">painel administrativo</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="enablePushBtn" class="btn-reports" style="display:none;" title="Ativar Notificações">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
        <button id="searchToggleBtn" class="btn-reports" title="Buscar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </header>

    <div id="searchBar" style="display:none; margin-bottom:16px;">
      <input type="search" id="searchInput" class="search-input" style="width:100%; box-sizing:border-box;" placeholder="buscar por autor ou conteúdo…" />
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" id="tabReports">Denúncias</button>
      <button class="tab-btn" id="tabIdols">Idols</button>
    </div>

    <!-- Composer -->
    <section class="compose-section">
      <input type="file" id="composeAvatarInput" accept="image/*" style="display:none">
      <div id="profileSelector" class="profile-selector" style="display:none;">
        <div class="profile-selector-label">postar como:</div>
        <div id="profileSelectorList" class="profile-selector-list"></div>
      </div>
      <div class="compose-row">
        <div class="compose-avatar-btn" id="composeAvatarBtn" title="Clique para selecionar foto de perfil">
          <div class="compose-avatar" id="composeAvatar"></div>
          <div class="compose-avatar-overlay">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
        </div>
        <div class="compose-body">
          <input type="text" id="composeCustomName" class="compose-custom-name"
            placeholder="nome de perfil customizado (opcional)…" maxlength="40"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <textarea id="composeText" class="compose-textarea" maxlength="300"
            placeholder="diga algo para a galera…" rows="2"></textarea>
          <div class="compose-footer">
            <div class="compose-time-wrap">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              <input type="datetime-local" id="composeCustomTime" class="compose-custom-time">
            </div>
            <span class="compose-count" id="composeCount">0/300</span>
            <button id="composeBtn" class="compose-btn" disabled>postar</button>
          </div>
        </div>
      </div>
    </section>

    <div id="reportsSectionLabel" class="reports-section-label" style="display:none;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
        <line x1="4" y1="22" x2="4" y2="15"/>
      </svg>
      denúncias pendentes
      <span class="reports-count-badge" id="postsCountTools"></span>
    </div>
    <div id="reportsList" class="post-list"></div>
    <div id="idolsList" class="post-list" style="display:none;"></div>

    <div id="countdownSettingsPanel" style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-subtle); display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <h3 style="font-size: 1rem; color: var(--pink-neon);">Contagem Regressiva</h3>
      <div style="display: flex; gap: 10px; align-items: center;">
        <input type="datetime-local" id="countdownTimeInput" class="search-input" style="min-width: 200px;">
        <button id="toggleCountdownBtn" class="btn-report-maintain" style="padding: 9px 20px;">Iniciar</button>
      </div>
    </div>

    <footer style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: center;">
      <button id="toggleOfflineBtn" class="btn-report-del" style="max-width: 200px;">Retirar do ar</button>
    </footer>

  </div>

  <!-- Loading -->
  <div id="loadingScreen" class="state-loading">
    <svg class="spinner" width="32" height="32" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" stroke="rgba(255,45,120,0.3)" stroke-width="3" fill="none"/>
      <path d="M12 2a10 10 0 0 1 10 10" stroke="#ff2d78" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <p style="margin-top:12px;font-size:.85rem">carregando…</p>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Confirm modal (delete) -->
  <div id="confirmOverlay" class="confirm-overlay hidden">
    <div class="confirm-card">
      <div class="confirm-icon">🗑️</div>
      <div class="confirm-title" id="confirmTitle">Deletar post?</div>
      <div class="confirm-desc" id="confirmDesc">Esta ação é permanente.</div>
      <div class="confirm-actions">
        <button id="confirmCancel" class="btn-cancel">cancelar</button>
        <button id="confirmOk" class="btn-confirm-del">deletar</button>
      </div>
    </div>
  </div>

  <!-- Manter modal -->
  <div id="maintainOverlay" class="confirm-overlay hidden">
    <div class="confirm-card">
      <div class="confirm-title">Manter post?</div>
      <div class="confirm-desc" id="maintainDesc"></div>
      <div id="maintainNoteWrap" class="hidden">
        <label class="maintain-label">Justificativa (obrigatória para 3+ denúncias)</label>
        <textarea id="maintainNoteInput" class="maintain-textarea"
          placeholder="Explique o motivo de manter este post…" maxlength="300"></textarea>
      </div>
      <div class="confirm-actions">
        <button id="maintainCancel" class="btn-cancel">cancelar</button>
        <button id="maintainOk" class="btn-confirm-maintain">manter</button>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div id="editModalOverlay" class="edit-modal-overlay hidden">
    <div class="edit-modal-card">
      <div class="edit-modal-title">Editar post</div>
      <textarea id="editModalText" class="edit-modal-textarea" maxlength="300" placeholder="texto do post…"></textarea>
      <input type="datetime-local" id="editModalTime" class="edit-modal-time">
      <div class="edit-modal-actions">
        <button id="editModalCancel" class="btn-edit-cancel">cancelar</button>
        <button id="editModalSave" class="btn-edit-save">salvar</button>
      </div>
    </div>
  </div>

  <script type="module" src="./adm.js"></script>

</body>
</html>
