<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d0015" />
  <link rel="icon" type="image/png" href="../icon.png" />
  <title>Weverse Hangover — Live Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+KR:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./board.css" />
</head>

<body>
  <div class="display-frame">
    <div class="display-viewport">

      <div class="bg-particles" id="bgParticles"></div>

      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <span class="brand-hangul">WEVERSE</span>
            <span class="brand-hangover">HANGOVER</span>
          </div>
        </div>
      </header>

      <div class="grid-area">

        <div class="board-loading" id="boardLoading">
          <svg class="spinner" width="36" height="36" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="rgba(255,45,120,0.25)" stroke-width="2.5" fill="none" />
            <path d="M12 2a10 10 0 0 1 10 10" stroke="#ff2d78" stroke-width="2.5" fill="none" stroke-linecap="round" />
          </svg>
          <div class="board-loading-text">carregando posts…</div>
        </div>

        <div class="board-empty hidden" id="boardEmpty">
          <span class="empty-icon">✦</span>
          <p>nenhum post ainda</p>
        </div>

        <div class="grid-scroll" id="gridScroll">
          <div class="grid-inner" id="gridInner"></div>
        </div>

        <div class="new-post-overlay" id="newPostOverlay">
          <div class="new-post-backdrop" id="newPostBackdrop"></div>
          <div class="new-post-card-container" id="newPostContainer"></div>
        </div>

      </div>

    </div>
  </div>

  <div class="pause-indicator" id="pauseIndicator">
    <span class="pause-icon"><span></span><span></span></span>
    pausado
  </div>

  <div id="countdownScreen" class="countdown-overlay hidden">
    <div class="countdown-title">HANGUL HANGOVER<br>COUNTDOWN</div>
    <div id="countdownTimerText" class="countdown-timer">--:--:--</div>
    <div class="countdown-subtitle">260523<br>COMEBACK STAGE</div>
  </div>

  <script type="module" src="./board.js"></script>
</body>

</html>
